description.French=Vous héritez d'une propriété d'un oncle inconnu, située à la périphérie de la petite ville d'Arkham. Vous n'avez jamais été dans cette contrée, c'est l'occasion d'emmener votre fiancée et vos amis pour aller visiter l'endroit...\n\nCe scénario possède 5 fins différentes et 3 façons de perdre en plus de l'investigateur éliminé. Quelle sera votre destinée?\n\nVous devez au moins choisir un personnage masculin qui sera l'héritier et au moins un personnage féminin qui sera sa fiancée.
description.Spanish=Heredas una propiedad de uno de tus tíos del que nunca habías tenido noticias hasta ahora. Está situada a las afueras de la pequeña ciudad de Arkham. Nunca has estado en esa región, así que se te ocurre que puede ser la oportunidad perfecta para llevar a tu prometida y a tus amigos para que conozcan el lugar... \n\n Este escenario posee 5 finales diferentes y 3 formas de perder, sin contar con la habitual de eliminación de un investigador. ¿Cuál será vuestro destino? \n\n Debes elegir al menos un personaje masculino que será el heredero y al menos un personaje femenino que será su prometida.
